name: shigure-auto-post

on:
  schedule:
    # 2時間ごとに起動（JST 奇数時）
    - cron: '0 1 * * *'   #  10:00 JST
    - cron: '0 3 * * *'   #  12:00 JST
    - cron: '0 5 * * *'   #  14:00 JST
    - cron: '0 7 * * *'   #  16:00 JST
    - cron: '0 9 * * *'   #  18:00 JST
    - cron: '0 11 * * *'  #  20:00 JST
    - cron: '0 13 * * *'  #  22:00 JST
  workflow_dispatch:
    inputs:
      command:
        description: 'command (daily / post / status)'
        required: true
        default: 'status'

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: create env file
        run: |
          printf 'ANTHROPIC_API_KEY=%s\n' '${{ secrets.ANTHROPIC_API_KEY }}' > .env
          printf 'THREADS_ACCESS_TOKEN=%s\n' '${{ secrets.THREADS_ACCESS_TOKEN }}' >> .env
          printf 'THREADS_USER_ID=%s\n' '${{ secrets.THREADS_USER_ID }}' >> .env
          printf 'X_API_KEY=%s\n' '${{ secrets.X_API_KEY }}' >> .env
          printf 'X_API_SECRET=%s\n' '${{ secrets.X_API_SECRET }}' >> .env
          printf 'X_ACCESS_TOKEN=%s\n' '${{ secrets.X_ACCESS_TOKEN }}' >> .env
          printf 'X_ACCESS_TOKEN_SECRET=%s\n' '${{ secrets.X_ACCESS_TOKEN_SECRET }}' >> .env
          printf 'X_BEARER_TOKEN=%s\n' '${{ secrets.X_BEARER_TOKEN }}' >> .env

      - name: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ github.event.inputs.command }}"
            echo "Manual: python main.py $CMD"
            python main.py $CMD
          else
            # 今日のdailyが未実行なら先に実行
            TODAY=$(date -u +%Y-%m-%d)
            DAILY_DONE=$(python -c "
          import json, pathlib
          h = json.loads(pathlib.Path('data/post_history.json').read_text()) if pathlib.Path('data/post_history.json').exists() else []
          today = '$TODAY'
          done = any(p.get('posted_at','').startswith(today) for p in h)
          print('yes' if done else 'no')
          " 2>/dev/null || echo "no")

            if [ "$DAILY_DONE" = "no" ]; then
              echo "Daily not done yet — running daily first"
              python main.py daily
            fi

            echo "Running post"
            python main.py post both
          fi
        env:
          PYTHONIOENCODING: utf-8

      - name: save state files
        run: |
          git config user.name "shigure-bot"
          git config user.email "bot@shigure-fortune.local"
          git add data/
          git diff --cached --quiet || git commit -m "bot: state update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
