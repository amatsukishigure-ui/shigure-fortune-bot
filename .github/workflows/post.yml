name: shigure-auto-post

on:
  schedule:
    # POST_SLOTS = [7, 9, 12, 16, 21, 22] に対応（JST = UTC+9）
    # 2026-07-12: 18時(ENG0.98%)→16時(ENG4.0%, 22likes/post)に変更
    - cron: '0 22 * * *'  #  07:00 JST (UTC22) — 朝ピーク
    - cron: '0 0 * * *'   #  09:00 JST (UTC00) — 朝の落ち着き
    - cron: '0 3 * * *'   #  12:00 JST (UTC03) — 昼ピーク
    - cron: '0 7 * * *'   #  16:00 JST (UTC07) — 夕方前ピーク（旧18時枠より高ENG）
    - cron: '0 12 * * *'  #  21:00 JST (UTC12) — 就寝前ピーク
    - cron: '0 13 * * *'  #  22:00 JST (UTC13) — before_sleep専用枠
    # 深夜返信専用スロット
    - cron: '0 16 * * *'  #  01:00 JST (UTC16) — reply only
    - cron: '0 19 * * *'  #  04:00 JST (UTC19) — reply only
  workflow_dispatch:
    inputs:
      command:
        description: 'command (daily / post / review / approve / approve 0 2 / reject 1 / status)'
        required: true
        default: 'status'

concurrency:
  group: shigure-post
  cancel-in-progress: false   # 実行中のジョブを中断せず、次のジョブを待機させる

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: setup python
        run: |
          python3 --version
          sudo ln -sf "$(which python3)" /usr/local/bin/python
          python --version

      - name: install dependencies
        run: python -m pip install --quiet --break-system-packages -r requirements.txt

      - name: create env file
        run: |
          printf 'ANTHROPIC_API_KEY=%s\n' '${{ secrets.ANTHROPIC_API_KEY }}' > .env
          printf 'THREADS_ACCESS_TOKEN=%s\n' '${{ secrets.THREADS_ACCESS_TOKEN }}' >> .env
          printf 'THREADS_USER_ID=%s\n' '${{ secrets.THREADS_USER_ID }}' >> .env
          printf 'X_API_KEY=%s\n' '${{ secrets.X_API_KEY }}' >> .env
          printf 'X_API_SECRET=%s\n' '${{ secrets.X_API_SECRET }}' >> .env
          printf 'X_ACCESS_TOKEN=%s\n' '${{ secrets.X_ACCESS_TOKEN }}' >> .env
          printf 'X_ACCESS_TOKEN_SECRET=%s\n' '${{ secrets.X_ACCESS_TOKEN_SECRET }}' >> .env
          printf 'X_BEARER_TOKEN=%s\n' '${{ secrets.X_BEARER_TOKEN }}' >> .env

      - name: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ github.event.inputs.command }}"
            echo "Manual: python main.py $CMD"
            python main.py $CMD
          else
            HOUR_UTC=$(date -u +%H)

            # 深夜返信専用スロット（01:00/04:00 JST = UTC 16/19）はリプライのみ
            # GHAのcron遅延(最大1h)を考慮して UTC 16-17 と 19-20 を両方カバー
            if [ "$HOUR_UTC" = "16" ] || [ "$HOUR_UTC" = "17" ] || [ "$HOUR_UTC" = "19" ] || [ "$HOUR_UTC" = "20" ]; then
              echo "夜間返信専用スロット — reply only"
              python main.py reply
            else
              # 期限切れコンテンツをクリーンアップしてからリフィル判断
              python -c "
            import sys; sys.path.insert(0,'.')
            from core.state import clean_expired_queue; clean_expired_queue()
            " 2>/dev/null || true

              # キュー＋承認待ちが10件以下なら補充（daily実行）
              # ただしキャップ: total>25 なら絶対に補充しない（積み上がり防止）
              NEED_REFILL=$(python -c "
            import json, pathlib
            q = json.loads(pathlib.Path('data/post_queue.json').read_text()) if pathlib.Path('data/post_queue.json').exists() else []
            p = json.loads(pathlib.Path('data/pending_posts.json').read_text()) if pathlib.Path('data/pending_posts.json').exists() else []
            total = len(q) + len(p)
            print('yes' if total <= 10 else 'no')
            " 2>/dev/null || echo "yes")

              # キューキャップ: 25件超なら補充スキップ（異常蓄積の安全弁）
              QUEUE_TOTAL=$(python -c "
            import json, pathlib
            q = json.loads(pathlib.Path('data/post_queue.json').read_text()) if pathlib.Path('data/post_queue.json').exists() else []
            p = json.loads(pathlib.Path('data/pending_posts.json').read_text()) if pathlib.Path('data/pending_posts.json').exists() else []
            print(len(q) + len(p))
            " 2>/dev/null || echo "0")
              if [ "$QUEUE_TOTAL" -gt 25 ]; then
                echo "⚠️ Queue cap hit (${QUEUE_TOTAL} items > 25) — skipping daily"
                NEED_REFILL="no"
              fi

              if [ "$NEED_REFILL" = "yes" ]; then
                echo "Queue + pending low — running daily to refill"
                python main.py daily
                echo "Auto-approving all pending posts"
                python main.py approve
              fi

              echo "Running post"
              python main.py post threads

              echo "Running replier"
              python main.py reply
            fi
          fi
        env:
          PYTHONIOENCODING: utf-8

      - name: token health check (Sunday 08:00 JST = UTC 23:00)
        if: github.event_name == 'schedule'
        run: |
          HOUR_UTC=$(date -u +%H)
          DOW=$(date -u +%u)
          if [ "$HOUR_UTC" = "23" ] && [ "$DOW" = "7" ]; then
            echo "Checking Threads token validity..."
            python scripts/check_token.py
          fi
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

      - name: weight update (Mon/Thu/Sun 21:00 JST = UTC 12:00)
        if: github.event_name == 'schedule'
        run: |
          HOUR_UTC=$(date -u +%H)
          DOW=$(date -u +%u)  # 1=Mon ... 7=Sun
          if [ "$HOUR_UTC" = "12" ] && ([ "$DOW" = "1" ] || [ "$DOW" = "4" ] || [ "$DOW" = "7" ]); then
            echo "Weight update (3-day cycle: Mon/Thu/Sun)"
            python scripts/update_weights.py || echo "weight update skipped"
          fi

      - name: save state files
        run: |
          git config user.name "shigure-bot"
          git config user.email "bot@shigure-fortune.local"
          git add data/
          git diff --cached --quiet || git commit -m "bot: state update $(date -u +'%Y-%m-%d %H:%M') UTC"
          # push失敗時はリモートの変更を取り込んでリトライ（状態未保存→重複投稿を防ぐ）
          git push || (git fetch origin && git merge origin/master --no-edit -m "bot: merge remote state" && git push)
