name: shigure-auto-post

on:
  schedule:
    # POST_SLOTS = [6, 8, 12, 13, 16, 17, 18, 19, 22] に対応（JST = UTC+9）
    - cron: '0 21 * * *'  #  06:00 JST (UTC21)
    - cron: '0 23 * * *'  #  08:00 JST (UTC23)
    - cron: '0 3 * * *'   #  12:00 JST (UTC03)
    - cron: '0 4 * * *'   #  13:00 JST (UTC04)
    - cron: '0 7 * * *'   #  16:00 JST (UTC07)
    - cron: '0 8 * * *'   #  17:00 JST (UTC08)
    - cron: '0 9 * * *'   #  18:00 JST (UTC09)
    - cron: '0 10 * * *'  #  19:00 JST (UTC10)
    - cron: '0 13 * * *'  #  22:00 JST (UTC13)
    # 深夜返信専用スロット（22:00〜06:00 の8時間ギャップを埋める）
    - cron: '0 16 * * *'  #  01:00 JST (UTC16) — reply only
    - cron: '0 19 * * *'  #  04:00 JST (UTC19) — reply only
  workflow_dispatch:
    inputs:
      command:
        description: 'command (daily / post / review / approve / approve 0 2 / reject 1 / status)'
        required: true
        default: 'status'

concurrency:
  group: shigure-post
  cancel-in-progress: false   # 実行中のジョブを中断せず、次のジョブを待機させる

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: create env file
        run: |
          printf 'ANTHROPIC_API_KEY=%s\n' '${{ secrets.ANTHROPIC_API_KEY }}' > .env
          printf 'THREADS_ACCESS_TOKEN=%s\n' '${{ secrets.THREADS_ACCESS_TOKEN }}' >> .env
          printf 'THREADS_USER_ID=%s\n' '${{ secrets.THREADS_USER_ID }}' >> .env
          printf 'X_API_KEY=%s\n' '${{ secrets.X_API_KEY }}' >> .env
          printf 'X_API_SECRET=%s\n' '${{ secrets.X_API_SECRET }}' >> .env
          printf 'X_ACCESS_TOKEN=%s\n' '${{ secrets.X_ACCESS_TOKEN }}' >> .env
          printf 'X_ACCESS_TOKEN_SECRET=%s\n' '${{ secrets.X_ACCESS_TOKEN_SECRET }}' >> .env
          printf 'X_BEARER_TOKEN=%s\n' '${{ secrets.X_BEARER_TOKEN }}' >> .env

      - name: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ github.event.inputs.command }}"
            echo "Manual: python main.py $CMD"
            python main.py $CMD
          else
            HOUR_UTC=$(date -u +%H)

            # 深夜返信専用スロット（01:00/04:00 JST = UTC 16/19）はリプライのみ
            if [ "$HOUR_UTC" = "16" ] || [ "$HOUR_UTC" = "19" ]; then
              echo "夜間返信専用スロット — reply only"
              python main.py reply
            else
              # キュー＋承認待ちが3件以下なら補充（daily実行）
              NEED_REFILL=$(python -c "
            import json, pathlib
            q = json.loads(pathlib.Path('data/post_queue.json').read_text()) if pathlib.Path('data/post_queue.json').exists() else []
            p = json.loads(pathlib.Path('data/pending_posts.json').read_text()) if pathlib.Path('data/pending_posts.json').exists() else []
            print('yes' if len(q) + len(p) <= 3 else 'no')
            " 2>/dev/null || echo "yes")

              if [ "$NEED_REFILL" = "yes" ]; then
                echo "Queue + pending low — running daily to refill"
                python main.py daily
                echo "Auto-approving all pending posts"
                python main.py approve
              fi

              echo "Running post"
              python main.py post threads

              echo "Running replier"
              python main.py reply
            fi
          fi
        env:
          PYTHONIOENCODING: utf-8

      - name: save state files
        run: |
          git config user.name "shigure-bot"
          git config user.email "bot@shigure-fortune.local"
          git add data/
          git diff --cached --quiet || git commit -m "bot: state update $(date -u +'%Y-%m-%d %H:%M') UTC"
          # push失敗時はリモートの変更を取り込んでリトライ（状態未保存→重複投稿を防ぐ）
          git push || (git fetch origin && git rebase origin/master && git push)
