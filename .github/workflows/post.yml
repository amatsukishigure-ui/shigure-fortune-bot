name: shigure-auto-post

on:
  schedule:
    # POST_SLOTS = [7, 11, 16, 18, 21, 0] に対応（JST = UTC+9）
    # 2026-08-27: 12時(avg9.4, 11時と1h差重複)→18時(avg23.0, n=78)に変更
    # 2026-08-27: 22時(avg17.2, 21時と1h差重複)→00時(avg17.2, 21時との間隔確保)に変更
    - cron: '0 22 * * *'  #  07:00 JST (UTC22) — 朝枠 avg14.5
    - cron: '0 2 * * *'   #  11:00 JST (UTC02) — 午前枠 avg19.0
    - cron: '0 7 * * *'   #  16:00 JST (UTC07) — 夕方前ピーク avg26.3（最高）
    - cron: '0 9 * * *'   #  18:00 JST (UTC09) — 夕方枠 avg23.0（旧12時枠を移動）
    - cron: '0 12 * * *'  #  21:00 JST (UTC12) — 夜枠 avg17.5
    - cron: '0 15 * * *'  #  00:00 JST (UTC15) — 深夜枠 avg17.2（旧22時枠を移動）
    # 深夜返信専用スロット
    - cron: '0 16 * * *'  #  01:00 JST (UTC16) — reply only
    - cron: '0 19 * * *'  #  04:00 JST (UTC19) — reply only
  workflow_dispatch:
    inputs:
      command:
        description: 'command (daily / post / review / approve / approve 0 2 / reject 1 / status)'
        required: true
        default: 'status'

concurrency:
  group: shigure-post
  cancel-in-progress: false   # 実行中のジョブを中断せず、次のジョブを待機させる

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: setup python
        run: |
          python3 --version
          sudo ln -sf "$(which python3)" /usr/local/bin/python
          python --version

      - name: install dependencies
        run: python -m pip install --quiet --break-system-packages -r requirements.txt

      - name: create env file
        run: |
          printf 'ANTHROPIC_API_KEY=%s\n' '${{ secrets.ANTHROPIC_API_KEY }}' > .env
          printf 'THREADS_ACCESS_TOKEN=%s\n' '${{ secrets.THREADS_ACCESS_TOKEN }}' >> .env
          printf 'THREADS_USER_ID=%s\n' '${{ secrets.THREADS_USER_ID }}' >> .env
          printf 'X_API_KEY=%s\n' '${{ secrets.X_API_KEY }}' >> .env
          printf 'X_API_SECRET=%s\n' '${{ secrets.X_API_SECRET }}' >> .env
          printf 'X_ACCESS_TOKEN=%s\n' '${{ secrets.X_ACCESS_TOKEN }}' >> .env
          printf 'X_ACCESS_TOKEN_SECRET=%s\n' '${{ secrets.X_ACCESS_TOKEN_SECRET }}' >> .env
          printf 'X_BEARER_TOKEN=%s\n' '${{ secrets.X_BEARER_TOKEN }}' >> .env

      - name: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ github.event.inputs.command }}"
            echo "Manual: python main.py $CMD"
            python main.py $CMD
          else
            HOUR_UTC=$(date -u +%H)

            # 深夜返信専用スロット（01:00/04:00 JST = UTC 16/19）はリプライのみ
            # GHAのcron遅延(最大1h)を考慮して UTC 16-17 と 19-20 を両方カバー
            if [ "$HOUR_UTC" = "16" ] || [ "$HOUR_UTC" = "17" ] || [ "$HOUR_UTC" = "19" ] || [ "$HOUR_UTC" = "20" ]; then
              echo "夜間返信専用スロット — reply only"
              python main.py reply
            else
              # 期限切れコンテンツをクリーンアップしてからリフィル判断
              python -c "
            import sys; sys.path.insert(0,'.')
            from core.state import clean_expired_queue; clean_expired_queue()
            " 2>/dev/null || true

              # キュー＋承認待ちが20件以下なら補充（daily実行）
              # ただしキャップ: total>40 なら補充しない（積み上がり防止）
              NEED_REFILL=$(python -c "
            import json, pathlib
            q = json.loads(pathlib.Path('data/post_queue.json').read_text()) if pathlib.Path('data/post_queue.json').exists() else []
            p = json.loads(pathlib.Path('data/pending_posts.json').read_text()) if pathlib.Path('data/pending_posts.json').exists() else []
            total = len(q) + len(p)
            print('yes' if total <= 20 else 'no')
            " 2>/dev/null || echo "yes")

              # キューキャップ: 40件超なら補充スキップ（異常蓄積の安全弁）
              QUEUE_TOTAL=$(python -c "
            import json, pathlib
            q = json.loads(pathlib.Path('data/post_queue.json').read_text()) if pathlib.Path('data/post_queue.json').exists() else []
            p = json.loads(pathlib.Path('data/pending_posts.json').read_text()) if pathlib.Path('data/pending_posts.json').exists() else []
            print(len(q) + len(p))
            " 2>/dev/null || echo "0")
              if [ "$QUEUE_TOTAL" -gt 40 ]; then
                echo "⚠️ Queue cap hit (${QUEUE_TOTAL} items > 40) — skipping daily"
                NEED_REFILL="no"
              fi

              # kotodama_rank が0件ならキャップ内でも強制補充（top performer欠如防止）
              KR_COUNT=$(python -c "
            import json, pathlib
            q = json.loads(pathlib.Path('data/post_queue.json').read_text()) if pathlib.Path('data/post_queue.json').exists() else []
            print(sum(1 for x in q if x.get('pattern_id') == 'kotodama_rank'))
            " 2>/dev/null || echo "1")
              if [ "$KR_COUNT" = "0" ] && [ "$QUEUE_TOTAL" -le 40 ]; then
                echo "📌 kotodama_rank=0 — forcing daily to replenish top performer"
                NEED_REFILL="yes"
              fi

              if [ "$NEED_REFILL" = "yes" ]; then
                echo "Queue + pending low — running daily to refill"
                python main.py daily
                # approve: キャップ(40件)を超えない範囲で品質スコア上位から承認
                python -c "
            import sys, json, pathlib; sys.path.insert(0,'.')
            from core.state import load_pending, approve_pending, load_queue
            q = load_queue(); pending = load_pending()
            headroom = max(0, 40 - len(q))
            if headroom == 0:
                print('⚠️ キュー上限のため承認スキップ')
            else:
                idx = sorted(range(len(pending)), key=lambda i: pending[i].get('quality_score', 0), reverse=True)
                approve_pending(idx[:headroom])
                print(f'✅ {min(headroom, len(pending))}件承認（headroom={headroom}）')
            "
              fi

              echo "Running post"
              python main.py post threads

              echo "Running replier"
              python main.py reply
            fi
          fi
        env:
          PYTHONIOENCODING: utf-8

      - name: token health check (Sunday 08:00 JST = UTC 23:00)
        if: github.event_name == 'schedule'
        run: |
          HOUR_UTC=$(date -u +%H)
          DOW=$(date -u +%u)
          if [ "$HOUR_UTC" = "23" ] && [ "$DOW" = "7" ]; then
            echo "Checking Threads token validity..."
            python scripts/check_token.py
          fi
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

      - name: refresh Threads token (weekly, Sun 00:00 UTC = 09:00 JST)
        if: github.event_name == 'schedule'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          HOUR_UTC=$(date -u +%H)
          DOW=$(date -u +%u)  # 7=Sun
          if [ "$HOUR_UTC" = "0" ] && [ "$DOW" = "7" ]; then
            echo "🔄 Threads token 週次 refresh (60日延長)..."
            NEW_TOKEN=$(python scripts/refresh_token.py)
            if [ $? -eq 0 ] && [ -n "$NEW_TOKEN" ]; then
              echo "$NEW_TOKEN" | gh secret set THREADS_ACCESS_TOKEN --repo amatsukishigure-ui/shigure-fortune-bot
              echo "✅ GitHub Secret THREADS_ACCESS_TOKEN を更新しました"
            else
              echo "⚠️ token refresh 失敗 — 手動更新が必要です"
            fi
          fi

      - name: weight update (Mon/Thu/Sun 21:00 JST = UTC 12:00)
        if: github.event_name == 'schedule'
        run: |
          HOUR_UTC=$(date -u +%H)
          DOW=$(date -u +%u)  # 1=Mon ... 7=Sun
          if [ "$HOUR_UTC" = "12" ] && ([ "$DOW" = "1" ] || [ "$DOW" = "4" ] || [ "$DOW" = "7" ]); then
            echo "Weight update (3-day cycle: Mon/Thu/Sun)"
            python scripts/update_weights.py || echo "weight update skipped"
          fi

      - name: save state files
        run: |
          git config user.name "shigure-bot"
          git config user.email "bot@shigure-fortune.local"
          git add data/
          git diff --cached --quiet || git commit -m "bot: state update $(date -u +'%Y-%m-%d %H:%M') UTC"
          # push失敗時: fetch → merge(-X theirs でコンフリクト解消) → 再push を最大3回
          # -X theirs: queue/pending はリモート優先（重複投稿防止）; history はappend-onlyなので競合しにくい
          PUSH_OK=false
          for _i in 1 2 3; do
            git push && PUSH_OK=true && break
            echo "⚠️ push失敗($_i/3) — fetch & merge して再試行"
            git fetch origin master
            git merge -X theirs origin/master --no-edit -m "bot: re-merge state (attempt $_i)" || true
          done
          $PUSH_OK || echo "🚨 state push 3回失敗 — 次回実行で重複投稿が起きる可能性あり"
